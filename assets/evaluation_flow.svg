   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="118.8" y="201.91785" transform="rotate(-0 118.8 201.91785)">Train • 1,467</text>
