   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="342" y="101.713837" transform="rotate(-0 342 101.713837)">Then generate variants and remove canonical duplicates</text>
