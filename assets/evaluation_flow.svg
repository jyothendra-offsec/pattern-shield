   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="118.8" y="224.042197" transform="rotate(-0 118.8 224.042197)">Fit model, scaler and baseline</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="342" y="201.91785" transform="rotate(-0 342 201.91785)">Validation • 360</text>
   </g>
   <g id="text_7">
