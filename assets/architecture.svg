   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14263d" x="18.36" y="24.676406" transform="rotate(-0 18.36 24.676406)">PATTERN SHIELD</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #40566c" x="18.36" y="49.624406" transform="rotate(-0 18.36 49.624406)">Two representations. One request classifier.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="342" y="93.406856" transform="rotate(-0 342 93.406856)">Request text</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="342" y="108.545764" transform="rotate(-0 342 108.545764)">Offline input; no requests are sent</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="169.02" y="170.191256" transform="rotate(-0 169.02 170.191256)">Normalize + encode</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="169.02" y="187.326004" transform="rotate(-0 169.02 187.326004)">Up to two decoding passes; first 256 UTF-8 bytes</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="514.98" y="170.191256" transform="rotate(-0 514.98 170.191256)">Statistical feature extraction</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="514.98" y="187.326004" transform="rotate(-0 514.98 187.326004)">8 lexical features; at most 16,384 characters</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="169.02" y="247.760381" transform="rotate(-0 169.02 247.760381)">Token + position embeddings</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="169.02" y="264.942004" transform="rotate(-0 169.02 264.942004)">48 dimensions; token 0 reserved for padding</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="514.98" y="247.807256" transform="rotate(-0 514.98 247.807256)">Standardize features</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="514.98" y="264.942004" transform="rotate(-0 514.98 264.942004)">Scaler fitted on training requests only</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="169.02" y="325.376381" transform="rotate(-0 169.02 325.376381)">Transformer + masked pooling</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="169.02" y="342.558004" transform="rotate(-0 169.02 342.558004)">2 encoder layers; 4 heads; 48-value representation</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="514.98" y="325.423256" transform="rotate(-0 514.98 325.423256)">Concatenate + classification head</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="514.98" y="342.558004" transform="rotate(-0 514.98 342.558004)">48 learned values + 8 features = 56 values</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14263d" x="514.98" y="403.962581" transform="rotate(-0 514.98 403.962581)">Benign / SQLi / XSS</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #40566c" x="514.98" y="422.142124" transform="rotate(-0 514.98 422.142124)">Softmax scores + validation-selected alert threshold</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14263d" transform="translate(35.1 381.359156)">64,579 trainable parameters</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14263d" transform="translate(35.1 398.443781)">Trained from scratch</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14263d" transform="translate(35.1 415.528406)">No pretrained language model</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #40566c" x="18.36" y="490.372406" transform="rotate(-0 18.36 490.372406)">Research prototype • Synthetic default data • Scores are not calibrated attack probabilities</text>
   </g>
  </g>
 </g>
